services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito_helper}
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avito}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stt:
    image: ghcr.io/${GITHUB_REPOSITORY:-avito-helper}/stt:latest
    build: ../stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_cache:/root/.cache

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-avito-helper}/backend:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-avito_helper}
      DB_USERNAME: ${POSTGRES_USER:-avito}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-avito}
      # Хранилище: local (файлы в томе) | s3 (R2/Yandex/Garage/SeaweedFS)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-avito-helper}
      STT_URL: http://stt:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - avito_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      stt:
        condition: service_started

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-avito-helper}/frontend:latest
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  avito_storage:
  caddy_data:
  caddy_config:
  whisper_cache:
