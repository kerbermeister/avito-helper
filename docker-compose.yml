services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: avito_helper
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
    ports:
      - "5432:5432"
    volumes:
      - avito_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Голосовой ввод (faster-whisper). При первом старте скачивает модель (~сотни МБ).
  stt:
    build: ./stt
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8000:8000"
    volumes:
      - avito_whisper:/root/.cache

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Ограничение памяти для Java-приложения: 512 МиБ на контейнер.
    # JVM (Java 25) видит cgroup-лимит и считает heap от него, поэтому
    # MaxRAMPercentage=50 даёт heap ~256 МиБ, остальное — на Metaspace/стеки/буферы.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=128m"
      DB_URL: jdbc:postgresql://postgres:5432/avito_helper
      DB_USERNAME: avito
      DB_PASSWORD: avito
      STORAGE_TYPE: local
      STORAGE_LOCAL_DIR: /data/storage
      STT_URL: http://stt:8000
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET: dev-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me
    ports:
      - "8080:8080"
    volumes:
      - avito_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  avito_pgdata:
  avito_storage:
  avito_whisper:
