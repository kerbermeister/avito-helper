spring:
  application:
    name: avito-helper-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avito_helper}
    username: ${DB_USERNAME:avito}
    password: ${DB_PASSWORD:avito}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 300MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me}
  jwt:
    # Должен быть >= 32 символов (256 бит) для HS256
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    access-ttl-seconds: ${JWT_TTL_SECONDS:604800}
  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_LOCAL_DIR:./data/storage}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:avito-helper}
  stt:
    url: ${STT_URL:http://localhost:8000}
  image:
    # Сжатие загружаемых фото: максимальная сторона (px) и качество JPEG (0..1)
    max-dimension: ${IMAGE_MAX_DIMENSION:1600}
    quality: ${IMAGE_QUALITY:0.85}
    # Сторона миниатюры (px)
    thumb-dimension: ${IMAGE_THUMB_DIMENSION:400}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
