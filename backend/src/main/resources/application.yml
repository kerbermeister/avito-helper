spring:
  application:
    name: avito-helper-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avito_helper}
    username: ${DB_USERNAME:avito}
    password: ${DB_PASSWORD:avito}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 300MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me}
  jwt:
    # Должен быть >= 32 символов (256 бит) для HS256
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    access-ttl-seconds: ${JWT_TTL_SECONDS:604800}
  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_LOCAL_DIR:./data/storage}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:avito-helper}
  stt:
    # Локальное распознавание (контейнер faster-whisper)
    local:
      enabled: ${STT_LOCAL_ENABLED:true}
      url: ${STT_URL:http://localhost:8000}
    # Распознавание через OpenAI (gpt-4o-mini-transcribe)
    openai:
      enabled: ${STT_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_STT_MODEL:gpt-4o-mini-transcribe}
  image:
    # Сжатие загружаемых фото: максимальная сторона (px) и качество JPEG (0..1)
    max-dimension: ${IMAGE_MAX_DIMENSION:1600}
    quality: ${IMAGE_QUALITY:0.85}
    # Сторона миниатюры (px)
    thumb-dimension: ${IMAGE_THUMB_DIMENSION:400}
  voice:
    # Максимальная длительность надиктовки (сек) — по достижении запись останавливается
    max-recording-seconds: ${VOICE_MAX_RECORDING_SECONDS:45}
    # Порог уровня микрофона: ниже него запись считается тишиной и в STT не отправляется
    min-speech-level: ${VOICE_MIN_SPEECH_LEVEL:0.06}
    # Показывать ли кнопки надиктовки у отдельных полей (название/описание/цена/категория)
    field-dictation-enabled: ${VOICE_FIELD_DICTATION_ENABLED:true}
  gemini:
    # Включает/выключает провайдера структуризации (GEMINI_ENABLED=false — отключить)
    enabled: ${GEMINI_ENABLED:true}
    # Ключ Google AI Studio: https://aistudio.google.com/apikey
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  openai:
    # Включает/выключает провайдера структуризации (OPENAI_ENABLED=false — отключить)
    enabled: ${OPENAI_ENABLED:true}
    # Ключ OpenAI: https://platform.openai.com/api-keys
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # Файл логов. В Docker задаётся LOG_FILE=/logs/avito-helper.log,
  # а папка ./log монтируется в контейнер как /logs.
  file:
    name: ${LOG_FILE:./log/avito-helper.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
